<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04040f"><title>StudyPilot</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Amiri:wght@400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
:root{--bg:#04040f;--card:#11122a;--tx:#f1f1ff;--mu:#8e90b5;--ac:#7c5cff;--fs:16px}
[data-t=ocean]{--bg:#03111a;--card:#0b2433;--ac:#22b8f0}
[data-t=forest]{--bg:#04120a;--card:#0d2417;--ac:#3ddc84}
[data-t=sunset]{--bg:#150808;--card:#2a1210;--ac:#ff7a45}
[data-t=rose]{--bg:#150610;--card:#2b1022;--ac:#ff5fa2}
[data-t=violet]{--bg:#0a0618;--card:#1b1236;--ac:#a66bff}
[data-t=gold]{--bg:#100d03;--card:#241d08;--ac:#f5c542}
[data-t=paper]{--bg:#f4f5fb;--card:#fff;--tx:#16172b;--mu:#667;--ac:#5b4bff}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:var(--fs)/1.5 Poppins,sans-serif;padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:auto;padding:16px}
.view{display:none}.view.on{display:block;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font-size:1.5em;margin:8px 0 14px}h3{margin:16px 0 8px}small,.mu{color:var(--mu)}
.card{background:var(--card);border-radius:16px;padding:14px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center}.g{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card b{font-size:1.6em;display:block}
input,select,textarea{width:100%;background:var(--card);color:var(--tx);border:1px solid #8883;border-radius:12px;padding:10px;font:inherit;margin:0 0 8px}
input[type=checkbox]{width:22px;height:22px;margin:0}input[type=color]{padding:2px;height:42px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:600 1em Poppins;cursor:pointer;margin-bottom:8px}
a.btn{text-decoration:none;display:inline-block}
.btn.o{background:none;border:1px solid var(--ac);color:var(--ac)}
.chip{background:var(--card);color:var(--tx);border:1px solid #8883;border-radius:99px;padding:6px 14px;margin:0 6px 8px 0;font:inherit;text-transform:capitalize}
.chip.on{background:var(--ac);color:#fff}
.x{background:none;border:0;font-size:1.1em}.dn{text-decoration:line-through;opacity:.5}
.ringc{display:flex;align-items:center;gap:18px}.ringc svg{width:120px;transform:rotate(-90deg)}
.ringc circle{fill:none;stroke-width:10;stroke-linecap:round}.ringc .bg{stroke:#8883}
.ringc .fg{stroke:var(--ac);transition:stroke-dashoffset 1s;filter:drop-shadow(0 0 6px var(--ac))}
.ringc b{font-size:2em}
#tm{font-size:4.5em;font-weight:700;text-align:center;margin:20px 0 4px}#fm,#cy{text-align:center}
.bars{display:flex;gap:8px;height:130px;align-items:flex-end}.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;text-align:center}
.bars i{background:var(--ac);border-radius:6px;min-height:3px;transition:height .6s}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}.heat i{aspect-ratio:1;background:var(--ac);border-radius:4px}
.flip{text-align:center;padding:40px 14px;cursor:pointer}
.ar{font:1.6em Amiri,serif;direction:rtl}.ay{border-bottom:1px solid #8883;padding:12px 0}.ay .ar{font-size:1.9em;line-height:2.1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #8883}
nav button{flex:1;background:none;border:0;color:var(--mu);font:.7em Poppins}nav button span{display:block;font-size:1.7em}nav .on{color:var(--ac)}
#splash,#onb{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:50;transition:opacity .5s}
#splash h1{font-size:2.2em}#splash i{font-size:4em;font-style:normal;color:var(--ac);animation:pul 1.2s infinite alternate}
@keyframes pul{to{transform:scale(1.2);text-shadow:0 0 30px var(--ac)}}
#onb{z-index:40}#onb .em{font-size:5em}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:8px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:60}#toast.on{opacity:1}
.cf{position:fixed;top:-10px;width:8px;height:12px;z-index:99;animation:fall 1.5s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="splash"><i>✦</i><h1>StudyPilot</h1><p class="mu">Plan. Focus. Grow.</p></div>
<div id="onb" hidden></div>
<main>
<section id="home" class="view on"></section>
<section id="study" class="view"></section>
<section id="focus" class="view">
 <h1>⏱ Focus</h1><div class="row"><button class="chip on" id="bf" onclick="setMode('f')">Focus</button><button class="chip" id="bb" onclick="setMode('b')">Break</button></div>
 <div id="tm">25:00</div><p id="fm"></p><p id="cy" class="mu"></p>
 <div class="row" style="margin-top:20px"><button class="btn g" onclick="startT()">▶ Start</button><button class="btn o g" onclick="pauseT()">⏸ Pause</button><button class="btn o" onclick="resetT()">↺</button></div>
</section>
<section id="quran" class="view"></section>
<section id="prog" class="view"></section>
<section id="set" class="view"></section>
</main>
<nav>
<button class="on" data-v="home"><span>🏠</span>Home</button><button data-v="study"><span>📚</span>Study</button><button data-v="focus"><span>⏱</span>Focus</button><button data-v="quran"><span>🕌</span>Quran</button><button data-v="prog"><span>📊</span>Progress</button><button data-v="set"><span>⚙️</span>Me</button>
</nav>
<div id="toast"></div>
<script>
/* ===== 1. YOUR SUPABASE KEYS (already filled in) ===== */
const SB_URL='https://lryhksbykyktsfpcklzj.supabase.co', SB_KEY='sb_publishable_PU7QS0Fwdk0LdsgRmLa6aw_jx7g6UTM';
/* =========================================================== */
/* remove the old app's saved copy so the new version always loads */
try{if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister())).catch(()=>{});if(window.caches)caches.keys().then(k=>k.forEach(x=>caches.delete(x)))}catch(e){}
const sb=(SB_URL.startsWith('http')&&window.supabase)?supabase.createClient(SB_URL,SB_KEY):null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),D=()=>iso(new Date());
const id=()=>Date.now()+Math.floor(Math.random()*999);
const T=['midnight','ocean','forest','sunset','rose','violet','gold','paper'];
const def={name:'',bio:'',theme:'midnight',accent:'',fs:16,goal:60,focus:25,brk:5,onb:false,w:{ring:1,stats:1,exam:1,quran:1},tasks:[],notes:[],cards:[],log:{},exam:{n:'',d:''},q:{last:null,marks:[]},t:0};
let S=Object.assign({},def,JSON.parse(localStorage.sp3||'{}')),user=null,st='tasks';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
function beep(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1);o.start();o.stop(a.currentTime+1)}catch(e){}}
function boom(){for(let i=0;i<24;i++){const c=document.createElement('i');c.className='cf';c.style.cssText=`left:${Math.random()*100}vw;background:hsl(${Math.random()*360},90%,60%);animation-delay:${Math.random()*.3}s`;document.body.append(c);setTimeout(()=>c.remove(),1800)}}

/* ---------- storage + cloud sync ---------- */
function save(){S.t=Date.now();localStorage.sp3=JSON.stringify(S);clearTimeout(save.h);if(user&&sb)save.h=setTimeout(push,1500)}
async function push(){const{error}=await sb.from('user_data').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()});toast(error?'Sync failed':'Synced ✓')}
async function pull(){const{data}=await sb.from('user_data').select('data').eq('user_id',user.id).maybeSingle();
 if(data&&data.data&&(data.data.t||0)>S.t){S=Object.assign({},def,data.data);localStorage.sp3=JSON.stringify(S);applyAll();toast('Data loaded ✓')}else push()}
async function auth(k){if(!sb)return toast('Add Supabase keys first');const email=$('#em').value.trim(),password=$('#pw').value;
 const r=k=='up'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 toast(r.error?r.error.message:k=='up'?'Check your email to confirm':'Logged in ✓')}
async function logout(){await sb.auth.signOut();toast('Logged out')}
if(sb)sb.auth.onAuthStateChange((_e,s)=>{user=s?s.user:null;if(user)setTimeout(pull,0);rSet();rHome()});

/* ---------- helpers ---------- */
function streak(){let n=0,d=new Date();if(!S.log[D()])d.setDate(d.getDate()-1);while(S.log[iso(d)]>0){n++;d.setDate(d.getDate()-1)}return n}
function last(n){return[...Array(n)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-n+1+i);return[iso(d),d.toLocaleDateString('en',{weekday:'short'})]})}
function applyAll(){document.documentElement.dataset.t=S.theme;const r=document.documentElement.style;r.setProperty('--fs',S.fs+'px');S.accent?r.setProperty('--ac',S.accent):r.removeProperty('--ac');rAll()}
function rAll(){rHome();rStudy();rProg();rSet();rFocus()}
function show(v){$$('.view').forEach(e=>e.classList.toggle('on',e.id==v));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));if(v=='quran')rQ();scrollTo(0,0)}
$$('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));

/* ---------- home ---------- */
function rHome(){const h=new Date().getHours(),m=S.log[D()]||0,p=Math.min(1,m/S.goal),left=S.tasks.filter(t=>!t.d).length;
 let ex='';if(S.exam.d){const n=Math.ceil((new Date(S.exam.d)-new Date(D()))/864e5);ex=`<div class=card>⏳ ${esc(S.exam.n||'Exam')}<br><b>${n>=0?n+' days left':'Done. Well done!'}</b></div>`}
 $('#home').innerHTML=`<h1>${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}${S.name?', '+esc(S.name):''}.</h1>`
 +(!user&&sb?`<div class=card onclick="show('set')">☁️ Sign in to sync your data across devices</div>`:'')
 +(S.w.ring?`<div class="card ringc"><svg viewBox="0 0 120 120"><circle class=bg cx=60 cy=60 r=52 /><circle class=fg cx=60 cy=60 r=52 style="stroke-dasharray:327;stroke-dashoffset:${327*(1-p)}"/></svg><div><b>${Math.round(p*100)}%</b><br><small>${m} of ${S.goal} min today</small></div></div>`:'')
 +(S.w.stats?`<div class=grid><div class=card><b>${left}</b><small>Tasks left</small></div><div class=card><b>${streak()} 🔥</b><small>Day streak</small></div><div class=card><b>${m}</b><small>Focus minutes</small></div><div class=card><b>${S.cards.length}</b><small>Flashcards</small></div></div>`:'')
 +(S.w.exam?ex:'')+(S.w.quran&&S.q.last?`<div class=card onclick="show('quran');openS(${S.q.last})">🕌 Continue reading Surah ${S.q.last}</div>`:'')
 +`<button class=btn onclick="show('focus')">Start focus</button>`}

/* ---------- study ---------- */
let qc=null,qf=0,qs={r:0,w:0};
function rStudy(){const tabs=['tasks','notes','cards','quiz'].map(t=>`<button class="chip ${st==t?'on':''}" onclick="st='${t}';rStudy()">${t}</button>`).join('');let b='';
 if(st=='tasks')b=`<div class=row><input id=ti placeholder="New task"><select id=tp style="width:70px"><option value=3>🔴</option><option value=2 selected>🟡</option><option value=1>🟢</option></select></div><button class=btn onclick=addT()>Add task</button>`
  +[...S.tasks].sort((a,b)=>a.d-b.d||b.p-a.p).map(t=>`<div class="card row"><input type=checkbox ${t.d?'checked':''} onchange="tog(${t.id})"><span class="g ${t.d?'dn':''}">${['','🟢','🟡','🔴'][t.p]} ${esc(t.x)}</span><button class=x onclick="del('tasks',${t.id})">🗑</button></div>`).join('')||'<p class=mu>No tasks yet. Add your first one.</p>';
 if(st=='notes')b=`<input id=ns placeholder="Search notes" oninput=rNL()><textarea id=nt rows=3 placeholder="Write a note"></textarea><button class=btn onclick=addN()>Save note</button><div id=nl></div>`;
 if(st=='cards')b=`<input id=cf placeholder="Front (question)"><input id=cb placeholder="Back (answer)"><button class=btn onclick=addC()>Add card</button>`+S.cards.map(c=>`<div class="card row"><span class=g>${esc(c.f)}<br><small>${esc(c.b)}</small></span><button class=x onclick="del('cards',${c.id})">🗑</button></div>`).join('');
 if(st=='quiz'){if(!S.cards.length)b='<p class=mu>Add flashcards first, then quiz yourself here.</p>';else{if(!S.cards.find(c=>c.id==qc))qc=S.cards[Math.random()*S.cards.length|0].id;const c=S.cards.find(c=>c.id==qc);
  b=`<div class="card flip" onclick="qf=!qf;rStudy()"><h2>${esc(qf?c.b:c.f)}</h2><small>Tap to flip</small></div><div class=row><button class="btn o g" onclick="qa(0)">Again</button><button class="btn g" onclick="qa(1)">Got it</button></div><p>Score: ${qs.r} right, ${qs.w} again</p>`}}
 $('#study').innerHTML='<h1>📚 Study</h1>'+tabs+b;if(st=='notes')rNL()}
function addT(){const x=$('#ti').value.trim();if(!x)return;S.tasks.push({id:id(),x,p:+$('#tp').value,d:0});save();rAll()}
function tog(i){const t=S.tasks.find(t=>t.id==i);t.d=t.d?0:1;if(t.d)boom();save();rAll()}
function del(k,i){S[k]=S[k].filter(x=>x.id!=i);save();rAll()}
function addN(){const x=$('#nt').value.trim();if(!x)return;S.notes.unshift({id:id(),x});save();rStudy()}
function rNL(){const q=($('#ns').value||'').toLowerCase();$('#nl').innerHTML=S.notes.filter(n=>n.x.toLowerCase().includes(q)).map(n=>`<div class="card row"><span class=g>${esc(n.x)}</span><button class=x onclick="del('notes',${n.id})">🗑</button></div>`).join('')}
function addC(){const f=$('#cf').value.trim(),b=$('#cb').value.trim();if(!f||!b)return;S.cards.push({id:id(),f,b});save();rAll()}
function qa(ok){ok?qs.r++:qs.w++;qc=null;qf=0;rStudy()}

/* ---------- focus ---------- */
let mode='f',left=S.focus*60,end=0,cyc=0,timer=null;
function rFocus(){const m=Math.floor(left/60),s=left%60;$('#tm').textContent=m+':'+String(s).padStart(2,'0');$('#fm').textContent=mode=='f'?'Stay focused':'Take a break';$('#cy').textContent='Session '+(cyc%4+1)+' of 4';$('#bf').classList.toggle('on',mode=='f');$('#bb').classList.toggle('on',mode=='b')}
function setMode(m){pauseT();mode=m;left=(m=='f'?S.focus:S.brk)*60;rFocus()}
function startT(){if(timer)return;end=Date.now()+left*1000;timer=setInterval(()=>{left=Math.max(0,Math.round((end-Date.now())/1000));rFocus();if(!left)fin()},500)}
function pauseT(){clearInterval(timer);timer=null}
function resetT(){setMode(mode)}
function fin(){pauseT();beep();if(mode=='f'){S.log[D()]=(S.log[D()]||0)+S.focus;cyc++;save();mode='b';left=(cyc%4==0?15:S.brk)*60;boom();toast('Session done!')}else{mode='f';left=S.focus*60}rAll()}

/* ---------- progress ---------- */
function rProg(){const ds=last(7),mx=Math.max(30,...ds.map(([k])=>S.log[k]||0)),wk=ds.reduce((a,[k])=>a+(S.log[k]||0),0);
 $('#prog').innerHTML=`<h1>📊 Progress</h1><div class=grid><div class=card><b>${S.log[D()]||0}</b><small>Min today</small></div><div class=card><b>${wk}</b><small>Min this week</small></div><div class=card><b>${S.tasks.filter(t=>t.d).length}</b><small>Tasks done</small></div><div class=card><b>${streak()}</b><small>Day streak</small></div></div>
 <h3>Last 7 days</h3><div class="card bars">${ds.map(([k,l])=>`<div><i style="height:${(S.log[k]||0)/mx*100}%"></i><small>${l}</small></div>`).join('')}</div>
 <h3>Study habit (last 6 weeks)</h3><div class="card heat">${last(42).map(([k])=>`<i style="opacity:${S.log[k]?Math.min(1,.3+S.log[k]/S.goal*.7):.12}"></i>`).join('')}</div>`}

/* ---------- Quran (text + audio from alquran.cloud / islamic.network) ---------- */
let surahs=null,cur=null;
async function rQ(){const el=$('#quran');if(cur)return;
 if(!surahs){el.innerHTML='<h1>🕌 Quran</h1><p class=mu>Loading…</p>';try{surahs=(await(await fetch('https://api.alquran.cloud/v1/surah')).json()).data}catch(e){el.innerHTML='<h1>🕌 Quran</h1><p>Internet connection needed to load the Quran.</p>';return}}
 el.innerHTML='<h1>🕌 Quran</h1>'+(S.q.last?`<div class=card onclick="openS(${S.q.last})">▶ Continue: Surah ${S.q.last}</div>`:'')+'<input id=qsr placeholder="Search surah name or number" oninput=fq()><div id=ql></div>';fq()}
function fq(){const v=($('#qsr').value||'').toLowerCase();$('#ql').innerHTML=surahs.filter(s=>(s.englishName+s.name+s.number).toLowerCase().includes(v)).map(s=>`<div class="card row" onclick="openS(${s.number})"><b>${s.number}</b><span class=g>${s.englishName}<br><small>${s.englishNameTranslation}, ${s.numberOfAyahs} verses</small></span><span class=ar>${s.name}</span></div>`).join('')}
async function openS(n){S.q.last=n;save();show('quran');$('#quran').innerHTML='<p class=mu>Loading…</p>';
 try{const[a,e]=await Promise.all([`quran-uthmani`,`en.sahih`].map(ed=>fetch(`https://api.alquran.cloud/v1/surah/${n}/${ed}`).then(r=>r.json())));cur={n,a:a.data,e:e.data};drawS()}catch(x){cur=null;$('#quran').innerHTML='<p>Could not load. Check your internet.</p>'}}
function drawS(){const{n,a,e}=cur;$('#quran').innerHTML=`<button class="btn o" onclick="cur=null;rQ()">← All surahs</button><h1 class=ar style="text-align:center">${a.name}</h1><p style="text-align:center">${a.englishName}</p><audio controls style="width:100%;margin:10px 0" src="https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${n}.mp3"></audio>`
 +a.ayahs.map((y,i)=>{const k=n+':'+y.numberInSurah,m=S.q.marks.includes(k);return`<div class=ay><div class=row><small class=g>${y.numberInSurah}</small><button class=x onclick="mark('${k}')">${m?'★':'☆'}</button></div><div class=ar>${y.text}</div><p class=mu>${esc(e.ayahs[i].text)}</p></div>`}).join('')}
function mark(k){const m=S.q.marks;m.includes(k)?m.splice(m.indexOf(k),1):m.push(k);save();drawS()}

/* ---------- me / settings ---------- */
function rSet(){const A=user?`<p>Signed in as <b>${esc(user.email)}</b></p><button class=btn onclick=push()>Sync now</button> <button class="btn o" onclick=logout()>Log out</button>`:`<p class=mu>${sb?'Sign in to keep your data safe and sync devices.':'Cloud accounts are off. Add Supabase keys (see SETUP.md).'}</p><input id=em type=email placeholder="Email"><input id=pw type=password placeholder="Password (6+ characters)"><div class=row><button class="btn g" onclick="auth('in')">Log in</button><button class="btn o g" onclick="auth('up')">Sign up</button></div>`;
 const W=(k,l)=>`<label class=row style="margin-bottom:8px"><input type=checkbox ${S.w[k]?'checked':''} onchange="S.w.${k}=this.checked?1:0;save();rHome()"><span>${l}</span></label>`;
 $('#set').innerHTML=`<h1>⚙️ Me</h1><div class=card><h3 style="margin-top:0">Account</h3>${A}</div>
 <div class=card><h3 style="margin-top:0">Profile</h3><input placeholder="Your name" value="${esc(S.name)}" oninput="S.name=this.value;save()"><textarea rows=2 placeholder="Short bio or goal" oninput="S.bio=this.value;save()">${esc(S.bio)}</textarea></div>
 <div class=card><h3 style="margin-top:0">Look</h3>${T.map(t=>`<button class="chip ${S.theme==t?'on':''}" onclick="S.theme='${t}';S.accent='';save();applyAll()">${t}</button>`).join('')}
 <p class=mu>Custom accent color</p><input type=color value="${S.accent||'#7c5cff'}" onchange="S.accent=this.value;save();applyAll()"><p class=mu>Text size</p><input type=range min=14 max=20 value="${S.fs}" onchange="S.fs=+this.value;save();applyAll()"></div>
 <div class=card><h3 style="margin-top:0">Home screen</h3>${W('ring','Progress ring')}${W('stats','Stats')}${W('exam','Exam countdown')}${W('quran','Continue Quran')}</div>
 <div class=card><h3 style="margin-top:0">Goals</h3><small>Daily goal (min)</small><input type=number value="${S.goal}" onchange="S.goal=+this.value||60;save();rHome()"><small>Focus length (min)</small><input type=number value="${S.focus}" onchange="S.focus=+this.value||25;save();resetT()"><small>Break length (min)</small><input type=number value="${S.brk}" onchange="S.brk=+this.value||5;save()"><small>Exam name and date</small><input placeholder="Exam name" value="${esc(S.exam.n)}" onchange="S.exam.n=this.value;save();rHome()"><input type=date value="${S.exam.d}" onchange="S.exam.d=this.value;save();rHome()"></div>
 <div class=card><h3 style="margin-top:0">Backup</h3><button class=btn onclick=exp()>Export</button> <button class="btn o" onclick="$('#imp').click()">Import</button> <button class="btn o" onclick=clr()>Clear all</button><input id=imp type=file accept=.json hidden onchange=imp(this)></div>
 <details class=card><summary>Privacy Policy and Terms</summary><p class=mu>Guests: data stays on this device. Signed-in users: your study data is stored in your private account, visible only to you, and never sold or shared. Delete it any time with Clear all. The app is provided as is, free of charge. Contact: add your email here.</p></details>
 <div class=card style="text-align:center"><h3 style="margin-top:0">About StudyPilot</h3><p class=mu>Version 3.0<br>${user?'Your data is saved to your account and synced.':'Your data stays on this device.'}</p><p class=mu style="margin-top:10px">Founder &amp; Creator</p><b>Asjadh Rilwan</b></div>
 <div class=card style="text-align:center"><h3 style="margin-top:0">Contact us</h3><p class=mu>Questions, feedback or business inquiries? Message us any time.</p><a class=btn href="https://wa.me/94774209718?text=Hi%20StudyPilot%2C%20I%20have%20an%20inquiry." target=_blank rel=noopener style="background:#25d366">💬 WhatsApp</a> <a class="btn o" href="tel:+94774209718">📞 077 420 9718</a> <a class="btn o" href="mailto:mohamedramzr459@gmail.com">✉️ Email</a></div>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)]));a.download='studypilot-backup.json';a.click()}
function imp(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{S=Object.assign({},def,JSON.parse(t));save();applyAll();toast('Imported ✓')}catch(e){toast('Invalid file')}})}
function clr(){if(confirm('Delete all data on this device'+(user?' and in your account':'')+'?')){S=Object.assign({},def);save();applyAll();rOnb(0)}}

/* ---------- onboarding ---------- */
const SL=[['📚','Plan','Organise tasks, notes and flashcards in one place.'],['⏱','Focus','Use the timer to build a daily streak.'],['📊','Track','Watch your progress, habits and goals grow.']];
function rOnb(i){const o=$('#onb');o.hidden=false;o.style.opacity=1;
 o.innerHTML=i<3?`<div class=em>${SL[i][0]}</div><h1>${SL[i][1]}</h1><p class=mu>${SL[i][2]}</p><br><button class=btn onclick="rOnb(${i+1})">Next</button>`
 :`<div class=em>👋</div><h1>What should we call you?</h1><input id=on placeholder="Your name" style="max-width:300px;text-align:center"><button class=btn onclick="fin2()">Start studying</button>`}
function fin2(){S.name=$('#on').value.trim();S.onb=true;save();$('#onb').style.opacity=0;setTimeout(()=>$('#onb').hidden=true,500);applyAll()}

applyAll();
setTimeout(()=>{$('#splash').style.opacity=0;setTimeout(()=>$('#splash').remove(),500);if(!S.onb)rOnb(0)},1200);
</script></body></html>
