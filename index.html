<!doctype html>
<html lang="en" data-theme="dark" data-accent="indigo" data-glass="2" data-motion="full" data-density="cozy" data-font="sans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StudyPilot — Learn smarter. Prepare better. Grow every day.</title>
<meta name="description" content="StudyPilot: study planner, notes, flashcards, quizzes, exam simulator, focus room and Quran reader. Built by Asjadh Rilwan.">
<meta name="theme-color" content="#0b0d14">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StudyPilot">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-mark">🧭</div>
  <div class="splash-name">StudyPilot</div>
</div>

<div id="netbar" class="netbar" hidden>You are offline — saved data still works.</div>

<header id="appbar" class="appbar" hidden>
  <div class="appbar-in">
    <button class="iconbtn" data-act="back" aria-label="Back" hidden>‹</button>
    <div class="brand" data-act="go" data-to="home">
      <span class="brand-mark" aria-hidden="true">🧭</span>
      <span class="brand-txt"><b>StudyPilot</b><i>Learn smarter</i></span>
    </div>
    <div class="appbar-actions">
      <button class="iconbtn" data-act="go" data-to="search" aria-label="Search">🔍</button>
      <button class="iconbtn" data-act="install" id="installBtn" aria-label="Install app" hidden>⬇</button>
      <button class="iconbtn" data-act="go" data-to="settings" aria-label="Settings">⚙</button>
    </div>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<nav id="tabbar" class="tabbar" aria-label="Primary" hidden>
  <div class="tabbar-in" id="tabbarIn"></div>
</nav>

<div id="sheetRoot"></div>
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="false"></div>
<div id="installBanner" class="installbar" hidden>
  <span>Install StudyPilot for offline study.</span>
  <button class="btn btn-sm btn-primary" data-act="install">Install</button>
  <button class="iconbtn" data-act="dismiss-install" aria-label="Dismiss">✕</button>
</div>

<script src="./app.js" defer></script>
</body>
</html>
